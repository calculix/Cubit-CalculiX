[pytest]
python_files = *.py *.pyx
testpaths = src
junit_suite_name = OpenPiscoPyTests
junit_duration_report = call
addopts = --continue-on-collection-errors -v --ignore-glob=*/Macro_Aster/* --ignore-glob=*/test_*.py 
env = 
    ASTER_NO_FAIL=True
    FREEFEM_NO_FAIL=True
    JUPYTER_PLATFORM_DIRS=1
    
#more info about this env variable in 
#https://jupyter-core.readthedocs.io/en/latest/changelog.html#migrate-to-standard-platform-directories