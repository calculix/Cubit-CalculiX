[metadata]
name = OpenPisco
version = 1.4.1
description = A toolbox for topology optimization
author_email = chiara.nardoni@safrangroup.com
url = https://gitlab.com/openpisco/openpisco
long_description = A toolbox for topology optimization
license = LGPL v3
platform = Linux, Windows, OSX

[options]
python_requires = >3.10


package_dir =
   = src

scripts =
    scripts/openpisco
    scripts/openpiscocl

[options.packages.find]
where = src
include = OpenPisco*

[options.entry_points]
console_scripts =
    OpenPisco = OpenPisco.QtApp.OpenPiscoGUI:LaunchPiscoGUI
    OpenPiscoCL = OpenPisco.CLApp.OpenPiscoCL:RunSimulation


[build_sphinx]
source-dir = docs
build-dir = docs/_build
